interface:
  display_name: "Review/Fix Loop"
  short_description: "Run one repo review and fix pass"
  default_prompt: "Use $review-fix-loop to run one review/fix loop in this repository. If I ask for max loops, repeated sessions, or automation, create/update an automation by default. Respect max_loop, state_dir, continuous_mode, cadence, and prompt overrides."

policy:
  allow_implicit_invocation: true
